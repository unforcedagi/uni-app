[package]
name = "uni-app-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Uni desktop shell (Tauri 2)"

# Mobile (Android/iOS) needs the app as a shared/static lib; `main.rs` stays the
# desktop entry point. Name is `uni_app_tauri_lib` so it doesn't clash with the bin.
[lib]
name = "uni_app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
uni-core = { workspace = true }
tauri = { version = "2.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
nostr = { workspace = true }
zeroize = { workspace = true }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "~2.3.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tracing-subscriber = { workspace = true }
# 2.13+ pulls Tauri 2.12; stay on the Tauri 2.11 release line.
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
