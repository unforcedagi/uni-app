[package]
name = "uni-app-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Uni desktop shell (Tauri 2)"

# Mobile (Android/iOS) needs the app as a shared/static lib; `main.rs` stays the
# desktop entry point. Name is `uni_app_tauri_lib` so it doesn't clash with the bin.
[lib]
name = "uni_app_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
uni-core = { workspace = true }
tauri = { version = "2.4", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
nostr = { workspace = true }
zeroize = { workspace = true }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
