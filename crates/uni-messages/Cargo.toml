[package]
name = "uni-messages"
version.workspace = true
edition.workspace = true
# matrix-sdk 0.18 needs 1.93 (CI's Mac build is on 1.89, so the app only builds this behind its `messages` feature).
# 0.18 is the newest that shares rusqlite 0.37 (one libsqlite3-sys) with uni-core; 0.19 needs rusqlite 0.40.
rust-version = "1.93"
license.workspace = true
description = "Messages (T-278 prototype): one Matrix account, synced and read in Rust; the webview gets rows, never tokens or keys"
publish = false

[features]
# The dev-only HTTP bridge (src/bin/uni-messages-dev.rs) that lets a plain browser and Playwright drive this crate.
# T-313: `--transcribe-hub` transcribes voice messages as the app does (uni-core's client for uni-transcribe).
dev-bridge = ["dep:axum", "dep:clap", "dep:rustls", "dep:tracing-subscriber", "dep:uni-core", "dep:nostr", "tokio/rt-multi-thread", "tokio/signal"]

[dependencies]
matrix-sdk = { version = "=0.18.0", default-features = false, features = ["e2e-encryption", "sqlite", "automatic-room-key-forwarding"] }
matrix-sdk-ui = { version = "=0.18.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.9"
# the bridges' login QR codes, drawn by the app from their modules (link.rs)
qrcode = { version = "0.14", default-features = false }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio", "query"] }
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
uni-core = { path = "../uni-core", optional = true }
nostr = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# tests/lifecycle.rs: a fake homeserver on 127.0.0.1, so the account's lifecycle runs against something it can't tell apart
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[[bin]]
name = "uni-messages-dev"
path = "src/bin/uni-messages-dev.rs"
required-features = ["dev-bridge"]
