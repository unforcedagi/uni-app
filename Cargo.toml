[workspace]
members = ["crates/uni-core", "crates/uni-core-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"

[workspace.dependencies]
# Buzz upstream crates, by path (spec §5).
buzz-ws-client = { path = "../buzz/crates/buzz-ws-client" }
buzz-sdk = { path = "../buzz/crates/buzz-sdk" }

# Must match the `nostr` version buzz pins (buzz/Cargo.toml) so types interop.
nostr = { version = "0.44", features = ["nip44", "nip98"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "vendored"] }
clap = { version = "4", features = ["derive", "env"] }
# tokio-tungstenite (via buzz-ws-client) uses rustls without a default provider;
# install ring explicitly at startup, as buzz-cli does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

uni-core = { path = "crates/uni-core" }

# buzz pins a fork of aws-creds for its relay; path-depending on buzz-sdk /
# buzz-ws-client does not pull it in, so no patch section is needed here.
