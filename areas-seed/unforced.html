<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unforced Development — practice</title>
<style>
  :root { --text:#1c2622; --muted:#5c6862; --accent:#40695b; --surface:#fffefa; --line:rgba(64,105,91,.18); --btn:#2f5046; --btn-ink:#fff;
          --sans:Inter,system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --mono:ui-monospace,monospace; }
  @media (prefers-color-scheme: dark) { :root { --text:#ece8de; --muted:#9aa59d; --accent:#7fb8a4; --surface:#16211d; --line:rgba(184,212,200,.18); --btn:#7fb8a4; --btn-ink:#0f1a16; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* one type role: sans everywhere; serif only for the hero title */
  body { color: var(--text); font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums; background: transparent; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px clamp(14px, 4vw, 36px) calc(72px + env(safe-area-inset-bottom)); }
  header { padding: 6px 0 16px; }
  h1 { margin: 0; font: 500 clamp(40px, 8vw, 64px)/1 var(--serif); letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .stat { padding: 11px 16px; min-width: 0; } .stat + .stat { border-left: 1px solid var(--line); }
  .stat .k { font: 600 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .stat .v { font: 600 22px/1.2 var(--sans); letter-spacing: -.02em; margin-top: 2px; white-space: nowrap; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } .stat { padding: 10px 12px; } .stat .v { font-size: 19px; } .stat .v small { display: none; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card > h2 { margin: 0; padding: 12px 18px; font: 600 11px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .feed li:last-child { border-bottom: 0; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 12px var(--sans); }
  /* Uni is an outline, so it never reads as a filled tile */
  .av.uni { background: transparent !important; color: var(--accent); border: 1.5px solid var(--accent); }
  .feed .meta { display: flex; justify-content: space-between; gap: 8px; } .feed .meta b { font-weight: 600; } .feed .meta time { color: var(--muted); font-size: 12px; }
  .feed p { margin: 2px 0 0; color: color-mix(in srgb, var(--text) 86%, transparent); overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 11px 18px; border-bottom: 1px solid var(--line); } tr:last-child td { border-bottom: 0; }
  td.when { text-align: right; color: var(--muted); font-size: 12px; white-space: nowrap; }
  tr.row { cursor: pointer; } tr.row:hover td, tr.row:focus-visible td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tr.row td:first-child { font-weight: 500; }
  .empty { padding: 20px 18px; color: var(--muted); font-style: italic; }
  .compose { padding: 14px 18px 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; font: 500 12px var(--sans); }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 11px 13px; font: 14px/1.5 var(--sans); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 12px; outline: none; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
  .send { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .go { white-space: nowrap; cursor: pointer; border: 1px solid var(--btn); border-radius: 10px; padding: 10px 16px; background: var(--btn); color: var(--btn-ink); font: 600 13px var(--sans); }
  .go:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: default; } .hint { color: var(--muted); font-size: 12px; }
  .wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="title">Unforced Development</h1><div class="sub" id="sub">Client practice</div></header>
  <section class="stats" aria-label="At a glance">
    <div class="stat"><div class="k">Notes</div><div class="v" id="s-notes">–</div></div>
    <div class="stat"><div class="k">Messages</div><div class="v" id="s-msgs">–<small>recent</small></div></div>
    <div class="stat"><div class="k">Last heard</div><div class="v" id="s-last">–</div></div>
  </section>
  <div class="cols">
    <section class="card"><h2><span>Client pulse</span><span id="who"></span></h2><ul class="feed" id="feed"><li><span></span><span class="empty" style="padding:0">Loading…</span></li></ul></section>
    <section class="card"><h2><span>Engagement notes</span></h2><table><tbody id="notes"><tr><td class="empty">Loading…</td></tr></tbody></table></section>
    <section class="card wide"><h2><span>Quick word to the team</span></h2>
      <div class="compose" id="f">
        <div class="chips" id="chips"></div>
        <textarea id="t" maxlength="2000" placeholder="Write a message. It lands in the room as a draft; you press Send."></textarea>
        <div class="send"><button class="go" id="go" type="button" disabled>Draft in room</button><span class="hint" id="hint"></span></div>
      </div>
    </section>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function node(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function ago(iso) { var d = (Date.now() - Date.parse(iso)) / 1000; if (!(d >= 0)) return "–"; if (d < 3600) return Math.max(1, Math.round(d / 60)) + "m ago"; if (d < 86400) return Math.round(d / 3600) + "h ago"; return Math.round(d / 86400) + "d ago"; }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function leaf(path) { return String(path).split("/").pop(); }

  // The interface contract: uni.ready(), uni.vault (surface-client's VaultClient), uni.chat, uni.note.
  uni.ready().then(function (ctx) {
    var a = ctx.area;
    $("title").textContent = a.title || "Unforced Development"; document.title = a.title || "";
    $("sub").textContent = "Client practice" + (a.status ? " \u00b7 " + a.status : "");

    var voices = {}, count = 0;
    function row(m) {
      var li = node("li"), av = node("div", "av", (m.author || "?").charAt(0).toUpperCase()), body = node("div"), meta = node("div", "meta");
      if (m.author === "Uni") av.className = "av uni"; else av.style.background = "hsl(" + hue(m.author) + " 38% 38%)";
      meta.appendChild(node("b", "", m.author)); meta.appendChild(node("time", "", ago(m.created_at)));
      body.appendChild(meta); body.appendChild(node("p", "", m.content.length > 200 ? m.content.slice(0, 200) + "\u2026" : m.content));
      li.appendChild(av); li.appendChild(body);
      return li;
    }
    // Live: the host pushes each new message of the room (needs chat.read).
    uni.chat.onMessage(function (m) {
      var ul = $("feed"); if (ul.querySelector(".empty")) ul.textContent = "";
      ul.insertBefore(row(m), ul.firstChild);
      while (ul.children.length > 8) ul.removeChild(ul.lastChild);
      voices[m.author] = 1; count += 1;
      $("s-msgs").firstChild.nodeValue = String(count);
      $("s-last").textContent = ago(m.created_at);
      $("who").textContent = Object.keys(voices).length + " voices";
    });
    uni.chat.recent(20).then(function (r) {
      var ul = $("feed"); ul.textContent = ""; var people = {};
      $("s-msgs").firstChild.nodeValue = String(r.messages.length);
      $("s-last").textContent = r.messages.length ? ago(r.messages[0].created_at) : "\u2013";
      if (!r.messages.length) { var li0 = node("li"); li0.appendChild(node("span")); li0.appendChild(node("span", "empty", "Nothing from the room yet.")); ul.appendChild(li0); return; }
      r.messages.slice(0, 8).forEach(function (m) { people[m.author] = 1; ul.appendChild(row(m)); });
      voices = people; count = r.messages.length;
      $("who").textContent = Object.keys(people).length + " voices";
    }).catch(function () { $("feed").textContent = ""; });

    uni.vault.queryNotes({ pathPrefix: "Areas/" + a.name + "/", limit: 8 }).then(function (notes) {
      var tb = $("notes"); tb.textContent = ""; $("s-notes").textContent = String(notes.length);
      if (!notes.length) { var tr0 = node("tr"), td0 = node("td", "empty", "No engagement notes yet."); tr0.appendChild(td0); tb.appendChild(tr0); return; }
      notes.forEach(function (x) {
        var tr = node("tr", "row"); tr.tabIndex = 0;
        tr.appendChild(node("td", "", leaf(x.path))); tr.appendChild(node("td", "when", x.updatedAt ? ago(x.updatedAt) : ""));
        var open = function () { uni.note.open(x.path).catch(function () {}); };
        tr.addEventListener("click", open); tr.addEventListener("keydown", function (e) { if (e.key === "Enter") open(); });
        tb.appendChild(tr);
      });
    }).catch(function () { $("s-notes").textContent = "\u2013"; });
  });

  var t = $("t"), go = $("go");
  [["Status update", "Status update: "], ["Need a decision", "Need a decision on: "], ["Share a win", "Win to share: "]].forEach(function (c) {
    var b = node("button", "chip", c[0]); b.type = "button";
    b.addEventListener("click", function () { t.value = c[1]; go.disabled = false; t.focus(); }); $("chips").appendChild(b);
  });
  t.addEventListener("input", function () { go.disabled = !t.value.trim(); });
  go.addEventListener("click", function () {
    if (!t.value.trim()) return; go.disabled = true;
    uni.chat.draft(t.value).then(function () { $("hint").textContent = "Suggested. Tap \u201cAdd to draft\u201d at the top, then press Send in the room."; t.value = ""; })
      .catch(function (err) { $("hint").textContent = "Couldn't suggest: " + err.message; go.disabled = false; });
  });
})();
</script>
</body>
</html>
