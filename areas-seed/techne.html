<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Techne — workbench</title>
<style>
  :root { --text:#1c2622; --muted:#5c6862; --btn:var(--accent); --btn-ink:#fffefa; --accent:#40695b; --surface:#fffefa; --line:rgba(64,105,91,.18);
          --sans:Inter,system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --mono:ui-monospace,monospace; }
  @media (prefers-color-scheme: dark) { :root { --text:#ece8de; --muted:#9aa59d; --accent:#7fb8a4; --surface:#16211d; --line:rgba(184,212,200,.16); --btn-ink:#0f1a16; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--text); font: 14px/1.55 var(--sans); background-color: transparent;
         background-image: radial-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1.3px); background-size: 22px 22px; }
  .bench { max-width: 1080px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) calc(72px + env(safe-area-inset-bottom)); }
  .ruler { height: 10px; margin-bottom: 18px; opacity: .55;
           background: repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 8px), repeating-linear-gradient(90deg, var(--accent) 0 1px, transparent 1px 40px);
           background-size: 100% 4px, 100% 10px; background-repeat: no-repeat; background-position: 0 100%, 0 100%; border-bottom: 1px solid var(--accent); }
  .tag { font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 500 clamp(44px, 9vw, 76px)/.95 var(--serif); letter-spacing: -.02em; margin: 8px 0 14px; }
  h1 em { color: var(--accent); font-style: italic; }
  .purpose { max-width: 56ch; font: italic 400 20px/1.4 var(--serif); color: var(--muted); margin: 0 0 30px; }
  .more { margin: 8px 2px 0; color: var(--muted); font: 11px var(--mono); }
  /* Both rows share one column grid; cards size to their content. */
  .hero, .grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: start; }
  .hero { margin-bottom: 18px; }
  .hero .purpose { margin-bottom: 8px; }
  @media (max-width: 760px) { .hero, .grid { grid-template-columns: minmax(0, 1fr); } .hero { margin-bottom: 0; } .hero + .grid { margin-top: 18px; } }
  .panel { position: relative; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 20px; }
  .panel::before { content: ""; position: absolute; left: 14px; top: -1px; width: 38px; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
  .panel h2 { margin: 6px 0 14px; font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .thread { list-style: none; margin: 0; padding: 0 0 0 18px; }
  .thread li { position: relative; padding: 0 0 16px; }
  .thread li:not(:last-child)::after { content: ""; position: absolute; left: -19px; top: 17px; bottom: -6px; border-left: 1px dashed var(--line); }
  .thread li:last-child { padding-bottom: 0; }
  .thread li::before { content: ""; position: absolute; left: -23px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
  .thread .who { font-weight: 600; } .thread time { margin-left: 8px; color: var(--muted); font: 11px var(--mono); }
  .thread p { margin: 2px 0 0; color: color-mix(in srgb, var(--text) 82%, transparent); overflow-wrap: anywhere; }
  .empty { color: var(--muted); font: italic 18px var(--serif); }
  .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .tools button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
                  padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; transition: transform .15s, border-color .15s; }
  .tools button:hover, .tools button:focus-visible { border-color: var(--accent); transform: translateX(3px); }
  .tools b { font-weight: 500; } .tools small { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
  #f { margin-top: 4px; }
  textarea { display: block; width: 100%; min-height: 120px; resize: vertical; padding: 12px 14px; color: var(--text); font: 15px/24px var(--sans); background-color: var(--surface);
             border: 1px solid var(--line); border-radius: 12px; outline: none;
             /* rules sit on each text baseline: one 24px tile per line (line-height), the rule 18px down (a 15px/24px Inter baseline is ~17.5px),
                painted in the content box only so nothing is ruled above the first line, and scrolling with the text */
             background-image: linear-gradient(to bottom, transparent 18px, var(--line) 18px 19px, transparent 19px), none; background-size: 100% 24px, auto; background-repeat: repeat-y, no-repeat;
             background-origin: content-box, padding-box; background-clip: content-box, border-box; background-attachment: local, scroll; }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  button.go { white-space: nowrap; cursor: pointer; border: 1px solid var(--btn); border-radius: 999px; padding: 10px 18px; background: var(--btn); color: var(--btn-ink); font: 600 13px var(--sans); }
  button.go:disabled { background: transparent; border-color: var(--line); color: var(--muted); cursor: default; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="bench">
  <div class="ruler" aria-hidden="true"></div>
  <div class="hero">
    <div>
      <span class="tag" id="since">workbench</span>
      <h1 id="title">Techne</h1>
      <p class="purpose" id="purpose"></p>
    </div>
    <section class="panel" aria-label="Notes on the bench"><h2>On the bench</h2><ul class="tools" id="notes"><li class="empty">Clearing the bench…</li></ul><p class="more" id="more" hidden></p></section>
  </div>
  <div class="grid">
    <section class="panel" aria-label="Recent pulse"><h2>Pulse</h2><ol class="thread" id="pulse"><li class="empty">Listening…</li></ol></section>
    <section class="panel" aria-label="Say something"><h2>Leave a note for the room</h2>
      <div id="f"><textarea id="t" maxlength="2000" placeholder="What are you making?"></textarea>
        <div class="row"><button class="go" id="go" type="button" disabled>Draft in room</button><span class="hint" id="hint">Opens the room with your words in the composer.</span></div></div>
    </section>
  </div>
</main>
<script>
(function () {
  var pending = {}, n = 0, $ = function (id) { return document.getElementById(id); };
  function call(method, params) {
    return new Promise(function (resolve, reject) {
      var id = "t" + (++n); pending[id] = { resolve: resolve, reject: reject };
      parent.postMessage({ bridge: 1, id: id, method: method, params: params || {} }, "*");
      setTimeout(function () { if (pending[id]) { delete pending[id]; reject(new Error("timeout")); } }, 15000);
    });
  }
  addEventListener("message", function (e) {
    var m = e.data; if (!m || m.bridge !== 1) return;
    if (m.event === "theme") { var r = document.documentElement.style; ["text", "muted", "accent", "surface", "line", "sans", "serif", "mono"].forEach(function (k) { if (m.data[k]) r.setProperty("--" + k, m.data[k]); }); return; }
    var p = pending[m.id]; if (!p) return; delete pending[m.id];
    if ("error" in m) p.reject(new Error(m.error)); else p.resolve(m.result);
  });
  function node(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function ago(iso) { var d = (Date.now() - Date.parse(iso)) / 1000; if (!(d >= 0)) return ""; if (d < 3600) return Math.max(1, Math.round(d / 60)) + "m"; if (d < 86400) return Math.round(d / 3600) + "h"; return Math.round(d / 86400) + "d"; }
  function purposeOf(body) { var parts = String(body).replace(/^\s*#.*\n/, "").split(/\n\s*\n/); for (var i = 0; i < parts.length; i++) { var t = parts[i].replace(/[*_`>#]/g, "").replace(/\s+/g, " ").trim(); if (t) return t; } return ""; }

  call("area.get").then(function (a) {
    $("title").textContent = a.title || "Techne"; document.title = a.title || "Techne";
    $("purpose").textContent = purposeOf(a.body);
    if (a.metadata && a.metadata.since) $("since").textContent = "workbench · since " + a.metadata.since;
  }).catch(function () {});

  call("channel.recent", { limit: 12 }).then(function (r) {
    var ol = $("pulse"); ol.textContent = "";
    if (!r.messages.length) { ol.appendChild(node("li", "empty", "The room is quiet.")); return; }
    r.messages.forEach(function (m) {
      var li = node("li"), head = node("div");
      head.appendChild(node("span", "who", m.author)); head.appendChild(node("time", "", ago(m.created_at)));
      li.appendChild(head); li.appendChild(node("p", "", m.content.length > 220 ? m.content.slice(0, 220) + "…" : m.content));
      ol.appendChild(li);
    });
  }).catch(function () { $("pulse").textContent = ""; $("pulse").appendChild(node("li", "empty", "Couldn't reach the room.")); });

  call("notes.list", { limit: 12 }).then(function (r) {
    var ul = $("notes"); ul.textContent = "";
    if (!r.notes.length) { ul.appendChild(node("li", "empty", "Nothing on the bench yet.")); return; }
    var shown = r.notes.slice(0, 5), rest = r.notes.length - shown.length;
    if (rest > 0) { $("more").hidden = false; $("more").textContent = "+ " + rest + " more in the area"; }
    shown.forEach(function (x) {
      var li = node("li"), b = node("button"); b.type = "button";
      b.appendChild(node("b", "", x.title)); b.appendChild(node("small", "", x.updatedAt ? ago(x.updatedAt) : ""));
      b.addEventListener("click", function () { call("note.open", { ref: x.path }).catch(function () {}); });
      li.appendChild(b); ul.appendChild(li);
    });
  }).catch(function () { $("notes").textContent = ""; $("notes").appendChild(node("li", "empty", "Couldn't list notes.")); });

  var t = $("t"), go = $("go");
  t.addEventListener("input", function () { go.disabled = !t.value.trim(); });
  go.addEventListener("click", function () {
    if (!t.value.trim()) return; go.disabled = true;
    call("channel.compose", { text: t.value }).then(function () { $("hint").textContent = "Drafted. Press Send in the room when ready."; t.value = ""; })
      .catch(function (err) { $("hint").textContent = "Couldn't draft: " + err.message; go.disabled = false; });
  });
})();
</script>
</body>
</html>
