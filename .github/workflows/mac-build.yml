name: Uni macOS arm64 bundle
run-name: Uni ${{ inputs.version }} (${{ inputs.release_nonce }})

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact app commit to build (must equal workflow commit)
        required: true
        type: string
      version:
        description: Release version (X.Y.Z)
        required: true
        type: string
      release_nonce:
        description: Unique identifier for this dispatch
        required: true
        type: string

permissions:
  contents: read

env:
  BUZZ_SHA: 5669fdcbc13aa85b0edede555478ae11b6771e0a
  SIGN_ID: E82AA2442F66F08F3772C9D6F7ADD877A1290125

jobs:
  mac:
    runs-on: macos-15
    environment: uni-mac-signing
    timeout-minutes: 120
    steps:
      - name: Check out exact app commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: uni-app
          persist-credentials: false
          fetch-depth: 1
      - name: Validate inputs and checkout
        id: version
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sha=$(git -C uni-app rev-parse HEAD)
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ && "$INPUT_SHA" == "$sha" ]] || { echo 'source_sha must match workflow checkout'; exit 1; }
          version=$INPUT_VERSION
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $sha as $version"
      - name: Check out pinned Buzz dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/unforcedagi/buzz.git buzz
          git -C buzz checkout --quiet "$BUZZ_SHA"
          [[ $(git -C buzz rev-parse HEAD) == "$BUZZ_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (peeled annotated tag)
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: uni-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, pinned; toolchain 1.89.0 below
        with:
          toolchain: '1.89.0'
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        working-directory: uni-app
        run: pnpm install --frozen-lockfile
      - name: Import stable signing identity and updater key
        shell: bash
        env:
          MACSIGN_P12_BASE64: ${{ secrets.MACSIGN_P12_BASE64 }}
          MACSIGN_P12_PASSWORD: ${{ secrets.MACSIGN_P12_PASSWORD }}
          TAURI_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$MACSIGN_P12_BASE64" && -n "$MACSIGN_P12_PASSWORD" && -n "$TAURI_KEY" ]] || { echo 'Missing signing secret'; exit 1; }
          umask 077
          kc="$RUNNER_TEMP/uni-signing.keychain-db"
          p12="$RUNNER_TEMP/uni-signing.p12"
          printf '%s' "$MACSIGN_P12_BASE64" | base64 -D > "$p12"
          security create-keychain -p '' "$kc"
          security unlock-keychain -p '' "$kc"
          security set-keychain-settings -lut 7200 "$kc"
          security import "$p12" -k "$kc" -P "$MACSIGN_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '' "$kc" >/dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -p codesigning "$kc" | grep -q "$SIGN_ID"
          printf '%s' "$TAURI_KEY" > "$RUNNER_TEMP/uni.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/uni.key" >> "$GITHUB_ENV"
      - name: Build and verify bundle
        working-directory: uni-app
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          pnpm tauri build --bundles app --config "{\"version\":\"$VERSION\",\"bundle\":{\"macOS\":{\"signingIdentity\":\"$SIGN_ID\"}}}"
          app=target/release/bundle/macos/Uni.app
          [[ $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist") == "$VERSION" ]]
          codesign --verify --deep --strict "$app"
          codesign -dr - "$app" 2>&1 | grep -qi "$SIGN_ID"
          mkdir -p mac-output
          ditto -c -k --keepParent "$app" mac-output/Uni-mac-arm64.zip
          cp target/release/bundle/macos/Uni.app.tar.gz{,.sig} mac-output/
          test -s mac-output/Uni-mac-arm64.zip
          test -s mac-output/Uni.app.tar.gz
          test -s mac-output/Uni.app.tar.gz.sig
          echo "Bundle version $VERSION, certificate $SIGN_ID verified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uni-mac-arm64
          path: uni-app/mac-output/
          if-no-files-found: error
          retention-days: 2
      - name: Remove ephemeral keychain and updater key
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/uni-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/uni.key" "$RUNNER_TEMP/uni-signing.p12"
