name: macOS sandbox self-test

# T-335: the applet sandbox self-test on the real WKWebView of a debug build. Runs when the frame, the self-test, the
# Tauri shell or its pinned wry/Tauri versions change, so a regression on the Mac shows here, not on a person's Mac.
on:
  push:
    paths:
      - 'src/interface/**'
      - 'src-tauri/**'
      - 'scripts/t76/**'
      # what the harness builds on: the fixture's mock, the T-76 vite plugin, the rail and Settings the driver clicks
      - 'scripts/browser/areasFixture.ts'
      - 'vite.config.ts'
      - 'src/App.tsx'
      - 'src/shape/Bar.tsx'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.lock'
      - '.github/workflows/mac-sandbox.yml'
  workflow_dispatch:

concurrency:
  group: mac-sandbox-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUZZ_SHA: 5669fdcbc13aa85b0edede555478ae11b6771e0a

jobs:
  selftest:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: uni-app
          persist-credentials: false
          fetch-depth: 1
      - name: Check out pinned Buzz dependency
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/unforcedagi/buzz.git buzz
          git -C buzz checkout --quiet "$BUZZ_SHA"
          [[ $(git -C buzz rev-parse HEAD) == "$BUZZ_SHA" ]]
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (peeled annotated tag)
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: uni-app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, pinned; toolchain 1.93.0 below
        with:
          toolchain: '1.93.0'
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        working-directory: uni-app
        run: pnpm install --frozen-lockfile
      - name: Build the debug app with the harness frontend
        working-directory: uni-app
        shell: bash
        run: |
          set -euo pipefail
          UNI_T76=1 node node_modules/vite/bin/vite.js build
          pnpm tauri build --debug --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
      - name: Run the sandbox self-test in the real WKWebView
        working-directory: uni-app
        shell: bash
        env:
          OUT: ${{ runner.temp }}/t76
        run: scripts/t76/run-mac.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mac-sandbox-selftest
          path: |
            ${{ runner.temp }}/t76/selftest.json
            ${{ runner.temp }}/t76/error.txt
            ${{ runner.temp }}/t76/experiments.json
            ${{ runner.temp }}/t76/env.json
            ${{ runner.temp }}/t76/diag.json
            ${{ runner.temp }}/t76/progress.log
            ${{ runner.temp }}/t76/http.log
          if-no-files-found: warn
          retention-days: 14
